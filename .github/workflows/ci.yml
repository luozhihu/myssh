name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/e2e-cli.mjs

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # Pin the upstream commit so alignment failures mean a real regression,
      # not upstream drift.
      - name: Build upstream sshmng
        run: |
          git clone https://github.com/jim58246/sshmng.git /tmp/sshmng
          git -C /tmp/sshmng checkout a7740d5679e13183f2e55860b7aa49d6a2dd26c1
          go build -C /tmp/sshmng -o /tmp/sshmng-go ./cmd/sshmng
      - run: npm ci
      - run: npm run build
      - run: node scripts/align-output.mjs --go-bin /tmp/sshmng-go --require-go
